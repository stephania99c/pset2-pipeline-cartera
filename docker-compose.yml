services:
  kestra:
    image: kestra/kestra:latest
    command: server local
    user: "root"
    ports: ["8080:8080"]
    environment:
      ENV_SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      ENV_SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      ENV_SNOWFLAKE_PAT: ${SNOWFLAKE_PAT}
      ENV_SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      ENV_SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      ENV_FUENTE_URL: ${FUENTE_URL}
      KESTRA_CONFIGURATION: |
        kestra:
          server:
            basic-auth:
              enabled: true
              username: ${KESTRA_USER}
              password: ${KESTRA_PASSWORD}
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - kestra-data:/app/storage

  dbt:
    image: pset2-tools:1.0
    profiles: ["herramientas"]
    env_file: .env
    environment:
      DBT_PROFILES_DIR: /app/dbt
    working_dir: /app/dbt
    volumes:
      - ./dbt:/app/dbt
    entrypoint: ["dbt"]

volumes:
  kestra-data: